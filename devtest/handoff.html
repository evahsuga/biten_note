<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- ホーム画面に追加したとき、このページ自体がアプリとして開くようにする（manifest は読まない） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="開き方の試験">
<title>開き方の試験（開発用）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: #F2F2F7; color: #1C1C1E;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .note { color: #6b6b70; font-size: 13px; margin: 0 0 12px; }
  section { background: #fff; border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 4px 0; border-bottom: 1px solid #eee; }
  th { width: 42%; color: #6b6b70; font-weight: 600; padding-right: 8px; }
  td { word-break: break-all; }
  .big { font-size: 17px; font-weight: 700; }
  button, .btn {
    display: block; width: 100%; min-height: 44px; margin: 8px 0 0; padding: 10px;
    border: none; border-radius: 10px; background: #007AFF; color: #fff;
    font-size: 16px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer;
  }
  button.sub, .btn.sub { background: #E5E5EA; color: #1C1C1E; }
  input, select {
    width: 100%; min-height: 44px; padding: 8px 10px; font-size: 16px;
    border: 1px solid #C7C7CC; border-radius: 10px; background: #fff;
  }
  label { display: block; font-size: 13px; color: #6b6b70; margin: 8px 0 2px; }
  #log {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap;
    word-break: break-all; background: #1C1C1E; color: #E5E5EA; border-radius: 8px;
    padding: 8px; min-height: 60px; max-height: 320px; overflow-y: auto;
  }
  #copyStatus { font-size: 13px; color: #34C759; min-height: 1.5em; }
  #copyFallback { width: 100%; height: 120px; font-size: 12px; display: none; margin-top: 8px; }
</style>
</head>
<body>

<h1>開き方の試験（開発用）</h1>
<p class="note">開発用の動作確認ページです。美点発見noteの記録は読むだけで、書き換えません。</p>

<section>
  <h2>① このページが開いている場所</h2>
  <table id="envTable"><tbody></tbody></table>
</section>

<section>
  <h2>② この保存場所の目印</h2>
  <p class="note">目印は試験専用の保存領域に書きます。どの保存場所で開いているかの見分けに使います。</p>
  <div>いまの目印：<span id="markerNow" class="big">確認中…</span></div>
  <label for="markerLabel">目印の名前</label>
  <input id="markerLabel" type="text">
  <button id="btnWriteMarker">この保存場所に目印を書く</button>
  <button id="btnClearMarker" class="sub">目印を消す</button>
  <button id="btnPersist" class="sub">永続ストレージを申告する</button>
</section>

<section>
  <h2>③ 相手のページを開く</h2>
  <label for="targetPreset">開く先</label>
  <select id="targetPreset"></select>
  <label for="targetUrl">URL</label>
  <input id="targetUrl" type="url">
  <button id="btnOpen">window.open で開く</button>
  <a id="linkOpen" class="btn sub" target="_blank" rel="opener">リンク（新しいタブ）で開く</a>
  <p class="note" style="margin-top:8px">window.open で開いたあと、このページから相手へ合図を送り続けます（最大30秒）。相手が受け取ると、下の記録に相手側の状況が届きます。</p>
</section>

<section>
  <h2>④ やりとりの記録</h2>
  <div id="log"></div>
</section>

<section>
  <button id="btnCopy">結果をまとめてコピー</button>
  <div id="copyStatus"></div>
  <textarea id="copyFallback" readonly></textarea>
</section>

<script>
(function () {
  'use strict';

  var KIND = 'biten-handoff-test';
  var MARKER_DB = 'HandoffTestDB';   // 試験専用。アプリの BitenNoteDB とは別物
  var APP_DB = 'BitenNoteDB';
  var loadedAt = new Date();
  var env = {};           // 画面①の値（相手へ送る要約にも使う）
  var logLines = [];

  // ---------- 表示ヘルパー ----------
  function ts() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' +
           ('0' + d.getSeconds()).slice(-2);
  }
  function log(msg) {
    var line = ts() + ' ' + msg;
    logLines.push(line);
    var el = document.getElementById('log');
    el.textContent = logLines.join('\n');
    el.scrollTop = el.scrollHeight;
  }
  var ENV_ROWS = [
    ['page', 'ページ'],
    ['standalone', 'ホーム画面アプリとして開いている'],
    ['displayMode', '表示モード'],
    ['ios', 'iOS判定'],
    ['persisted', '永続ストレージの承認'],
    ['estimate', '使用量 / 上限'],
    ['opener', '開いた元（opener）'],
    ['from', '開いた元の申告（?from=）'],
    ['referrer', 'referrer'],
    ['marker', '目印'],
    ['appData', '美点発見noteのデータ'],
    ['loadedAt', '開いた時刻'],
    ['ua', 'UserAgent']
  ];
  function renderEnv() {
    var tbody = document.querySelector('#envTable tbody');
    tbody.innerHTML = '';
    ENV_ROWS.forEach(function (r) {
      var tr = document.createElement('tr');
      var th = document.createElement('th');
      var td = document.createElement('td');
      th.textContent = r[1];
      td.textContent = env[r[0]] === undefined ? '確認中…' : String(env[r[0]]);
      if (r[0] === 'standalone' || r[0] === 'persisted' || r[0] === 'marker') td.className = 'big';
      tr.appendChild(th); tr.appendChild(td); tbody.appendChild(tr);
    });
  }

  // ---------- 環境の測定 ----------
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function openerState() {
    if (!window.opener) return 'なし';
    try {
      // 同じ origin なら読める。別 origin なら例外になる
      return 'あり（同じ origin: ' + window.opener.location.origin + '）';
    } catch (e) {
      return 'あり（別の origin）';
    }
  }
  function measureSync() {
    env.page = location.origin + location.pathname;
    env.standalone = window.navigator.standalone === true ? 'はい（navigator.standalone）' :
      (window.navigator.standalone === false ? 'いいえ' : '判定なし（iOS以外）');
    env.displayMode = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ?
      'standalone' : 'browser';
    env.ios = isIOS() ? 'はい' : 'いいえ';
    env.opener = openerState();
    env.from = new URLSearchParams(location.search).get('from') || '（なし）';
    env.referrer = document.referrer || '（なし）';
    env.loadedAt = loadedAt.toLocaleString('ja-JP');
    env.ua = navigator.userAgent;
  }
  function measurePersisted() {
    if (!navigator.storage || typeof navigator.storage.persisted !== 'function') {
      env.persisted = '非対応';
      return Promise.resolve();
    }
    return navigator.storage.persisted().then(function (v) {
      env.persisted = v ? 'true（承認済み）' : 'false（未承認）';
    }).catch(function (e) { env.persisted = 'エラー: ' + e.message; });
  }
  function measureEstimate() {
    if (!navigator.storage || typeof navigator.storage.estimate !== 'function') {
      env.estimate = '非対応';
      return Promise.resolve();
    }
    return navigator.storage.estimate().then(function (est) {
      var mb = function (n) { return (n / 1024 / 1024).toFixed(1) + 'MB'; };
      env.estimate = mb(est.usage || 0) + ' / ' + mb(est.quota || 0);
    }).catch(function (e) { env.estimate = 'エラー: ' + e.message; });
  }

  // ---------- 目印（試験専用DB） ----------
  function openMarkerDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(MARKER_DB, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('marker', { keyPath: 'id' }); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function readMarker() {
    return openMarkerDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var r = db.transaction('marker', 'readonly').objectStore('marker').get('m');
        r.onsuccess = function () { db.close(); resolve(r.result || null); };
        r.onerror = function () { db.close(); reject(r.error); };
      });
    });
  }
  function writeMarker(value) {
    return openMarkerDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('marker', 'readwrite');
        if (value) tx.objectStore('marker').put(value); else tx.objectStore('marker').delete('m');
        tx.oncomplete = function () { db.close(); resolve(); };
        tx.onerror = function () { db.close(); reject(tx.error); };
      });
    });
  }
  function measureMarker() {
    return readMarker().then(function (m) {
      env.marker = m ? '「' + m.label + '」（' + m.writtenAt + ' に書いた）' : '（なし）';
      document.getElementById('markerNow').textContent = env.marker;
    }).catch(function (e) {
      env.marker = 'エラー: ' + e.message;
      document.getElementById('markerNow').textContent = env.marker;
    });
  }

  // ---------- 美点発見noteのデータ（読むだけ） ----------
  // ⚠ 存在しないDBを indexedDB.open すると空のDBが作られ、アプリ側の初期化が
  //   走らなくなる。databases() で存在を確かめてから開き、万一 upgrade が
  //   起きたら中止する。
  function countStore(db, name) {
    return new Promise(function (resolve) {
      if (!db.objectStoreNames.contains(name)) { resolve('ストアなし'); return; }
      var r = db.transaction(name, 'readonly').objectStore(name).count();
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { resolve('エラー'); };
    });
  }
  function measureAppData() {
    if (typeof indexedDB.databases !== 'function') {
      env.appData = '確認できない（ブラウザが一覧取得に非対応）';
      return Promise.resolve();
    }
    return indexedDB.databases().then(function (list) {
      var exists = list.some(function (d) { return d.name === APP_DB; });
      if (!exists) { env.appData = 'この保存場所には無い'; return; }
      return new Promise(function (resolve) {
        var req = indexedDB.open(APP_DB);
        req.onupgradeneeded = function () { req.transaction.abort(); };
        req.onerror = function () { env.appData = '開けなかった'; resolve(); };
        req.onsuccess = function () {
          var db = req.result;
          Promise.all([countStore(db, 'persons'), countStore(db, 'bitens')]).then(function (c) {
            db.close();
            env.appData = '人物 ' + c[0] + ' 件 / 美点 ' + c[1] + ' 件';
            resolve();
          });
        };
      });
    }).catch(function (e) { env.appData = 'エラー: ' + e.message; });
  }

  function measureAll() {
    measureSync();
    renderEnv();
    return Promise.all([measurePersisted(), measureEstimate(), measureMarker(), measureAppData()])
      .then(renderEnv);
  }

  function envSummary() {
    return {
      page: env.page, standalone: env.standalone, displayMode: env.displayMode,
      persisted: env.persisted, opener: env.opener, marker: env.marker, appData: env.appData
    };
  }
  function summaryText(s) {
    return '    ページ: ' + s.page + '\n' +
           '    ホーム画面アプリ: ' + s.standalone + ' / 表示モード: ' + s.displayMode + '\n' +
           '    永続ストレージ: ' + s.persisted + '\n' +
           '    opener: ' + s.opener + '\n' +
           '    目印: ' + s.marker + '\n' +
           '    美点発見noteのデータ: ' + s.appData;
  }

  // ---------- 開く先 ----------
  var SELF_PATH = 'devtest/handoff.html';
  var ORIGINS = {
    pages: 'https://evahsuga.github.io/biten_note/',
    netlify: 'https://bitennote.netlify.app/'
  };
  function presets() {
    var h = location.hostname;
    var list = [];
    if (h === 'localhost' || h === '127.0.0.1') {
      // ローカル試験：localhost と 127.0.0.1 は別の origin として扱われる
      var other = (h === 'localhost' ? '127.0.0.1' : 'localhost');
      var base = location.protocol + '//' + other + (location.port ? ':' + location.port : '') + '/';
      list.push(['相手側の試験ページ（' + other + '）', base + SELF_PATH]);
    } else if (h.indexOf('github.io') !== -1) {
      list.push(['Netlify の試験ページ', ORIGINS.netlify + SELF_PATH]);
      list.push(['Netlify の本番アプリ（トップ）', ORIGINS.netlify]);
    } else {
      list.push(['GitHub Pages の試験ページ', ORIGINS.pages + SELF_PATH]);
      list.push(['GitHub Pages のアプリ（トップ）', ORIGINS.pages]);
    }
    return list;
  }
  function withFrom(url) {
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 'from=' + encodeURIComponent(location.origin) +
           '&t=' + Date.now();
  }
  function targetOrigin(url) {
    try { return new URL(url).origin; } catch (e) { return '*'; }
  }

  // ---------- 送る側 ----------
  var pingTimer = null;
  var acked = false;
  function stopPing() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }
  function startPing(child, origin) {
    stopPing();
    acked = false;
    var seq = 0;
    pingTimer = setInterval(function () {
      seq++;
      var closed;
      try { closed = child.closed; } catch (e) { closed = '不明'; }
      if (closed === true) { log('相手のページが閉じられた（合図 ' + (seq - 1) + ' 回で停止）'); stopPing(); return; }
      try {
        child.postMessage({ kind: KIND, type: 'ping', seq: seq }, origin);
      } catch (e) {
        log('合図の送信でエラー: ' + e.message); stopPing(); return;
      }
      if (seq === 1) log('合図の送信を開始（送信先 ' + origin + '）');
      if (seq >= 60) {
        log('30秒間、相手から返事なし（合図 60 回）。' + (acked ? '' : '→ 相手に届いていない可能性'));
        stopPing();
      }
    }, 500);
  }
  function openWithWindowOpen() {
    var url = withFrom(document.getElementById('targetUrl').value.trim());
    log('window.open 実行: ' + url);
    var child = null;
    try {
      child = window.open(url, '_blank');
    } catch (e) {
      log('window.open で例外: ' + e.message);
      return;
    }
    log('window.open の戻り値: ' + (child ? 'あり（相手の窓を参照できる）' : 'null（参照できない／開けなかった）'));
    if (child) startPing(child, targetOrigin(url));
  }

  // ---------- 受ける側 ----------
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.kind !== KIND) return;
    if (d.type === 'ping') {
      if (d.seq === 1 || !window.__gotPing) log('合図を受信（#' + d.seq + '、送り元 ' + e.origin + '）→ 返事を送る');
      window.__gotPing = true;
      try { e.source.postMessage({ kind: KIND, type: 'ack', seq: d.seq, env: envSummary() }, e.origin); }
      catch (err) { log('返事の送信でエラー: ' + err.message); }
    } else if (d.type === 'ack') {
      if (!acked) {
        acked = true;
        stopPing();
        log('相手から返事あり（合図 #' + d.seq + ' に対して、送り元 ' + e.origin + '）。相手側の状況:\n' + summaryText(d.env));
      }
    } else if (d.type === 'hello') {
      log('開いた先から「開いた」の連絡を受信（送り元 ' + e.origin + '）。相手側の状況:\n' + summaryText(d.env));
    }
  });
  function sayHelloToOpener() {
    if (!window.opener) return;
    var from = new URLSearchParams(location.search).get('from');
    try {
      window.opener.postMessage({ kind: KIND, type: 'hello', env: envSummary() }, from || '*');
      log('開いた元へ「開いた」の連絡を送信（宛先 ' + (from || '*') + '）');
    } catch (e) {
      log('開いた元への連絡でエラー: ' + e.message);
    }
  }

  // ---------- コピー ----------
  function resultText() {
    var lines = ['【開き方の試験】' + new Date().toLocaleString('ja-JP'), '', '■ このページ'];
    ENV_ROWS.forEach(function (r) { lines.push(r[1] + ': ' + env[r[0]]); });
    lines.push('', '■ やりとりの記録');
    lines = lines.concat(logLines.length ? logLines : ['（なし）']);
    return lines.join('\n');
  }
  function copyResult() {
    var text = resultText();
    var status = document.getElementById('copyStatus');
    var fb = document.getElementById('copyFallback');
    var showFallback = function () {
      fb.style.display = 'block'; fb.value = text; fb.focus(); fb.select();
      status.textContent = '自動コピーできなかったため、下の欄を長押しでコピーしてください';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        status.textContent = 'コピーしました（' + text.length + '字）';
      }, showFallback);
    } else {
      showFallback();
    }
  }

  // ---------- 初期化 ----------
  function init() {
    var sel = document.getElementById('targetPreset');
    var input = document.getElementById('targetUrl');
    var link = document.getElementById('linkOpen');
    presets().forEach(function (p) {
      var o = document.createElement('option');
      o.textContent = p[0]; o.value = p[1]; sel.appendChild(o);
    });
    var syncLink = function () { link.href = withFrom(input.value.trim()); };
    sel.addEventListener('change', function () { input.value = sel.value; syncLink(); });
    input.addEventListener('input', syncLink);
    input.value = sel.value; syncLink();
    link.addEventListener('click', function () {
      syncLink();
      log('リンクで開く: ' + link.href);
    });

    document.getElementById('btnOpen').addEventListener('click', openWithWindowOpen);

    measureSync();
    document.getElementById('markerLabel').value =
      (env.standalone.indexOf('はい') === 0 ? 'ホーム画面アプリ' : 'ブラウザ') + '（' + location.hostname + '）';

    document.getElementById('btnWriteMarker').addEventListener('click', function () {
      var label = document.getElementById('markerLabel').value.trim() || '（名前なし）';
      writeMarker({ id: 'm', label: label, writtenAt: new Date().toLocaleString('ja-JP') })
        .then(function () { log('目印を書いた: 「' + label + '」'); return measureMarker(); })
        .then(renderEnv)
        .catch(function (e) { log('目印の書き込みでエラー: ' + e.message); });
    });
    document.getElementById('btnClearMarker').addEventListener('click', function () {
      writeMarker(null)
        .then(function () { log('目印を消した'); return measureMarker(); })
        .then(renderEnv)
        .catch(function (e) { log('目印の削除でエラー: ' + e.message); });
    });
    document.getElementById('btnPersist').addEventListener('click', function () {
      if (!navigator.storage || typeof navigator.storage.persist !== 'function') {
        log('永続ストレージの申告：非対応'); return;
      }
      navigator.storage.persist().then(function (granted) {
        log('永続ストレージの申告結果: ' + granted);
        return measurePersisted();
      }).then(renderEnv).catch(function (e) { log('永続ストレージの申告でエラー: ' + e.message); });
    });
    document.getElementById('btnCopy').addEventListener('click', copyResult);

    log('ページを開いた');
    measureAll().then(sayHelloToOpener);
  }

  init();
})();
</script>
</body>
</html>
