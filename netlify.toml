# 配信範囲の制限
#
# アプリの動作に必要のないファイル（内部文書・サーバ側コード・設定ファイル）を
# 公開しない。除外の指定はこのファイルを情報源とし、他所に書き写さないこと。
#
# ⚠ ここに書けるのは「配信しないもの」の列挙（deny-list）であり、書き忘れた
#    ものは配信される。新しいディレクトリやファイルを足したときは、
#    公開してよいものかを必ず確認すること。
#
# GitHub Pages 側の同等の設定は `_config.yml`（Jekyll の exclude）にある。
# 片方だけ更新すると食い違うので、必ず両方を揃えること。

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/extensions/*"
  to = "/404.html"
  status = 404
  force = true

# ルート直下の設定ファイル・文書（manifest.json / robots.txt は配信する）
